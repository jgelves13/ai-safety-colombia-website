name: Hub apply draft reminder

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/aplicar/draft-reminder
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS \
            "https://aisafetycolombia.org/api/aplicar/draft-reminder?secret=$CRON_SECRET"
